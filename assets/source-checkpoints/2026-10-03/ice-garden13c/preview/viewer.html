<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>氷の庭 — 接触13c</title><style>body{font:16px system-ui;background:#14202c;color:#dfedf5;margin:24px}main{max-width:1280px;margin:auto}button{padding:10px;margin:4px;background:#284454;color:white;border:1px solid #617f90;border-radius:4px}img{display:block;max-width:100%;image-rendering:pixelated;margin:16px 0}input{width:min(640px,100%)}small{color:#a6bfcd}</style><main><h1>氷の庭 — 接触13c</h1><p>同じ足元から片が開き、重心で回転して落ち、床で止まってから欠けて消える接触へ。</p><p><small>11cの主結晶・床を保護した独立表示試作。ゲーム操作・音・実機の手触りは未確認です。</small></p><div id="buttons"></div><img id="image" alt="接触比較"><label>接触をコマ送り <input id="scrub" type="range" min="0" max="31" value="0"></label><p id="time"></p></main><script>const files=[['12b → 13 通常速度','12b-to-13-contact.gif'],['13 接触 通常速度','contact-13.gif'],['全体動作 7.75秒','whole-13.gif'],['接触の全段階','contact-phases.png'],['斜め','oblique.png'],['近距離','near.png'],['明るい床','light.png'],['暗い床','dark.png']];const im=document.getElementById('image');for(const [title,file] of files){const b=document.createElement('button');b.textContent=title;b.dataset.file=file;b.onclick=()=>{im.src=file;document.getElementById('time').textContent=title};document.getElementById('buttons').append(b)}const slider=document.getElementById('scrub');slider.oninput=()=>{im.src='frames/'+String(slider.value).padStart(3,'0')+'.png';document.getElementById('time').textContent='接触 '+(Number(slider.value)*.025-.22).toFixed(3)+' 秒'};im.src=files[0][1];</script></html>
