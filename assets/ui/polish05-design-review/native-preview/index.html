<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectS · Minecraft実描画プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091014;color:#e7e5db;font:14px/1.6 "Yu Gothic UI",Meiryo,sans-serif}header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #b69a582c}h1{font:23px "Yu Mincho",Georgia,serif;color:#dcc69e;letter-spacing:.06em;margin:0}header p{margin:7px 0 0;color:#a9b5a8;font-size:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#172321;border:1px solid #7e825255;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{color:#ebcd94;border-color:#bda16a}button:focus-visible,select:focus-visible{outline:2px solid #e8c781;outline-offset:3px}a{color:#d2b87f;text-decoration:none}main{padding:20px 24px}.toolbar{display:flex;gap:14px;justify-content:space-between;margin-bottom:12px;color:#bfc5b7;font-size:12px}.badge{color:#d6c398}.viewport{position:relative;overflow:auto;background:#05090c;border:1px solid #71634466;min-height:220px;box-shadow:0 20px 60px #0004}#capture[hidden]{display:none}#capture{display:block;height:auto;max-width:none;image-rendering:auto}.viewport.fit #capture{width:100%!important}.empty{padding:60px 24px;color:#b1bcb0;text-align:center}.footer{display:flex;justify-content:space-between;gap:18px;margin-top:13px;color:#9fac9e;font-size:12px}.footer p{margin:0}details{margin-top:20px;color:#a7b4a6;font-size:12px}pre{white-space:pre-wrap}button:disabled{opacity:.45;cursor:default}@media(max-width:900px){header{align-items:flex-start;flex-direction:column}main{padding:15px 12px}.footer{display:block}.toolbar{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>Minecraft 実描画プレビュー</h1><p>Minecraft本体が描いた画面を、そのままPNGで表示します。</p></div><div class="controls"><label for="source">画像</label><select id="source"><option value="window">ウィンドウを自動取得</option><option value="f2">F2の原画像</option></select><button id="fit" aria-pressed="false">画面に合わせる</button><button id="pause" aria-pressed="false">更新を止める</button><button id="refresh">更新</button></div></header>
<main><div class="toolbar"><span id="state">Minecraftの画像を待っています…</span><span id="size" class="badge">原寸表示</span></div><div id="viewport" class="viewport"><div id="empty" class="empty">描画用Minecraftを起動すると、ここに実際の画面が表示されます。</div><img id="capture" alt="Minecraft本体から取得した画面" hidden></div><div class="footer"><p id="explanation">静止画を最大10回／秒で自動更新します。操作はMinecraft側で行います。</p><p id="time"></p></div><details><summary>取得情報</summary><pre id="metadata"></pre><p>ウィンドウ画像はWindowsが取得した表示結果です。F2はMinecraftが保存したPNGを無加工で表示します。</p></details></main>
<script>
const $=id=>document.getElementById(id);
let paused=false,fit=false,revision='',busy=false,version=0,metadata=null;
function layout(){if(!metadata)return;$('capture').style.width=(metadata.width/(window.devicePixelRatio||1))+'px';$('viewport').classList.toggle('fit',fit);$('size').textContent=`${metadata.width} × ${metadata.height} · ${fit?'画面に合わせる':'原寸表示'}`}
function age(){if(!metadata)return;const seconds=Math.max(0,Math.round((Date.now()-Date.parse(metadata.capturedAt))/1000));$('time').textContent=`取得 ${new Date(metadata.capturedAt).toLocaleTimeString('ja-JP')} · ${seconds}秒前`;
  if(paused)$('state').textContent='更新を停止中';else if($('source').value==='f2')$('state').textContent='Minecraftが保存したF2の原画像';else $('state').textContent=seconds>6?'新しい画像を待っています（最後の画像を表示中）':'Minecraftの実描画を自動更新中'}
async function refresh(force=false){if(busy||paused&&!force)return;busy=true;const request=version,source=$('source').value;
  try{const m=await fetch('/status?source='+source,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('取得情報を読み込めません');return r.json()});if(request!==version)return;
    if(m.state!=='ready'){$('state').textContent=source==='f2'?'F2の撮影を待っています…':'Minecraftの画像を待っています…';return}
    if(m.revision!==revision){const image=new Image();image.src=m.image;await image.decode();if(request!==version)return;$('capture').src=image.src;$('capture').hidden=false;$('empty').hidden=true;revision=m.revision}
    metadata=m;layout();age();$('metadata').textContent=JSON.stringify(m,null,2);
  }catch(e){if(request===version)$('state').textContent='画像の更新を待っています：'+e.message}finally{busy=false;if(request!==version)queueMicrotask(()=>refresh(true))}}
$('source').addEventListener('change',()=>{version++;revision='';metadata=null;$('capture').hidden=true;$('empty').hidden=false;$('time').textContent='';$('explanation').textContent=$('source').value==='f2'?'MinecraftでF2を押すと、保存された原画像へ自動で切り替わります。':'静止画を最大10回／秒で自動更新します。操作はMinecraft側で行います。';refresh(true)});
$('fit').addEventListener('click',()=>{fit=!fit;$('fit').setAttribute('aria-pressed',String(fit));$('fit').textContent=fit?'原寸で見る':'画面に合わせる';layout()});
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').setAttribute('aria-pressed',String(paused));$('pause').textContent=paused?'更新を再開':'更新を止める';age();if(!paused)refresh()});$('refresh').addEventListener('click',()=>refresh(true));
window.addEventListener('resize',layout);setInterval(()=>refresh(),100);setInterval(age,1000);refresh();
</script></body></html>
