<main>
  <header>
    <h1>魔術書　文字の直し（実機）</h1>
    <p>どちらも実機のスクリーンショット（1920×1080）から同じ場所を切り出し、2倍に拡大しています。直したのは2つです。①14px以下の字を1段太くした。②クライアントが文字の画像を少し縮めて描き、ドットの行が抜けていたのを、1ドット＝1画素になる大きさで描くようにした。「インク」のイ、「試し」のし、12,480 の 4 が欠けなくなりました。</p>
