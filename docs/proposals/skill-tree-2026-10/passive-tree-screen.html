<title>ツリー画面の見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0e1018;--fg:#ece6d8;--mute:#9a9385;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0}
.wrap{max-width:1600px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
h1{font-size:1.4rem;margin:0}
p{margin:0;color:var(--mute);line-height:1.6}
img{width:100%;height:auto;border:1px solid #2c2e33;border-radius:4px}
</style>
<div class="wrap">
<h1>ゲーム内のツリー画面（見本）</h1>
<p>地図と同じ作りの画面。焼き込んだ素材から合成した静止画で、戦士が14点取った状態です。端にカーソルで移動、ホイールで拡大縮小、同じノードを2回押すと道ごと取る、しゃがむと閉じる。</p>
<img src="passive-tree-screen.png" alt="パッシブツリー画面の見本。中央に金色の取得済みの道、右に選んだノードの説明と取るボタン">
</div>
