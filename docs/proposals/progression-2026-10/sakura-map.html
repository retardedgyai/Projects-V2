<title>桜牙獣の全体図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;700&family=DotGothic16&display=swap">
<style>
/* layout: one big swimlane picture (戦う人 / 鍛冶 / 魔術 / 市場) with two colored routes (枝角＝橙, 花びら＝桃), hover/tap a box to light its route; tiny legend below */
:root {
  --bg: #0c0f17; --panel: #141a27; --line: #2a3450; --fg: #ebe7dc; --muted: #959bb0;
  --horn: #f0a35e; --petal: #f2a3c0; --gold: #e6c477;
  --sans: "M PLUS 2", "Noto Sans CJK JP", system-ui, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
main { max-width: 1280px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
h1 { font-size: 1.4rem; margin: 0; }
p { margin: 0; color: var(--muted); }
.pic { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #0f1420; }
.pic svg { display: block; width: 100%; min-width: 900px; height: auto; }
.route { display: flex; gap: 8px; flex-wrap: wrap; }
.rbtn { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 16px; cursor: pointer; }
.rbtn[aria-pressed="true"].h { border-color: var(--horn); color: var(--horn); }
.rbtn[aria-pressed="true"].p { border-color: var(--petal); color: var(--petal); }
.rbtn[aria-pressed="true"].a { border-color: var(--gold); color: var(--gold); }
.rbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
svg .dim { opacity: .12; transition: opacity .2s; }
svg g, svg path { transition: opacity .2s; }
@media (prefers-reduced-motion: reduce) { svg g, svg path { transition: none; } }
</style>

<main>
  <h1>桜牙獣の全体図</h1>
  <p>文字を読まずに見る用。橙＝枝角の道、桃＝花びらの道。ボタンで片方だけ光らせられる。全部決まった（2026-10-20）。</p>
  <div class="route" role="group" aria-label="道を光らせる">
    <button class="rbtn a" data-r="all" aria-pressed="true">両方</button>
    <button class="rbtn h" data-r="horn" aria-pressed="false">枝角の道</button>
    <button class="rbtn p" data-r="petal" aria-pressed="false">花びらの道</button>
  </div>
  <div class="pic">
    <svg viewBox="0 0 1100 560" role="img" aria-label="桜牙獣の素材が、戦う人・鍛冶・魔術・市場の間を流れる図">
      <defs>
        <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0a35e"/></marker>
        <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f2a3c0"/></marker>
      </defs>
      <!-- lanes -->
      <g font-family="M PLUS 2, sans-serif" font-size="15" fill="#959bb0">
        <rect x="0" y="0" width="1100" height="140" fill="#121826"/><text x="14" y="26">⚔ 戦う人</text>
        <rect x="0" y="140" width="1100" height="140" fill="#0f1420"/><text x="14" y="166">🔨 鍛冶の職人</text>
        <rect x="0" y="280" width="1100" height="140" fill="#121826"/><text x="14" y="306">✦ 魔術の人</text>
        <rect x="0" y="420" width="1100" height="140" fill="#0f1420"/><text x="14" y="446">⚖ 市場（プレイヤーどうし）</text>
      </g>

      <g font-family="M PLUS 2, sans-serif" font-size="14" text-anchor="middle">
        <!-- boss -->
        <g data-r="both"><rect x="40" y="44" width="130" height="70" rx="14" fill="#2a1822" stroke="#f2a3c0" stroke-width="2"/><text x="105" y="76" fill="#f2a3c0" font-size="17" font-weight="700">桜牙獣</text><text x="105" y="98" fill="#959bb0" font-size="12">倒す・部位を壊す</text></g>

        <!-- horn route -->
        <g data-r="horn">
          <rect x="230" y="30" width="150" height="46" rx="10" fill="#2a1f14" stroke="#f0a35e"/><text x="305" y="52" fill="#f0a35e">枝角〈特性〉</text><text x="305" y="68" fill="#959bb0" font-size="11">特性は運で1つ</text>
          <rect x="440" y="180" width="160" height="56" rx="10" fill="#1b2233" stroke="#f0a35e"/><text x="520" y="204" fill="#ebe7dc">器を作る</text><text x="520" y="222" fill="#959bb0" font-size="11">桜牙の型・首飾り（特性は空）</text>
          <rect x="660" y="320" width="160" height="56" rx="10" fill="#1b2233" stroke="#f0a35e"/><text x="740" y="344" fill="#ebe7dc">注入で特性を入れる</text><text x="740" y="362" fill="#959bb0" font-size="11">祭壇で 枝角 → 器</text>
          <rect x="880" y="30" width="190" height="56" rx="10" fill="#2a1f14" stroke="#f0a35e" stroke-width="2"/><text x="975" y="54" fill="#f0a35e" font-weight="700">特性つきの装備</text><text x="975" y="72" fill="#959bb0" font-size="11">1つの装備に1つ</text>
          <rect x="440" y="320" width="160" height="56" rx="10" fill="#1b2233" stroke="#f0a35e"/><text x="520" y="344" fill="#ebe7dc">外れ3本 → 好きな1本</text><text x="520" y="362" fill="#959bb0" font-size="11">注入で合わせる</text>
          <rect x="230" y="470" width="150" height="46" rx="10" fill="#1b2233" stroke="#f0a35e"/><text x="305" y="498" fill="#ebe7dc">枝角を売り買い</text>
        </g>
        <g data-r="horn" fill="none" stroke="#f0a35e" stroke-width="2.5" marker-end="url(#mh)">
          <path d="M170 70 L228 55"/>
          <path d="M380 60 C430 60 430 200 438 205"/>
          <path d="M600 210 C650 210 650 340 658 345"/>
          <path d="M820 345 C870 345 870 70 878 62"/>
          <path d="M305 76 L305 468"/>
          <path d="M380 490 C420 490 430 360 438 352"/>
          <path d="M600 352 L658 352"/>
        </g>

        <!-- petal route -->
        <g data-r="petal">
          <rect x="230" y="96" width="150" height="40" rx="10" fill="#2a1822" stroke="#f2a3c0"/><text x="305" y="121" fill="#f2a3c0">花びら甲殻</text>
          <rect x="440" y="240" width="160" height="34" rx="10" fill="#1b2233" stroke="#f2a3c0"/><text x="520" y="262" fill="#ebe7dc">皮革精製 → 花弁片</text>
          <rect x="660" y="384" width="160" height="30" rx="10" fill="#1b2233" stroke="#f2a3c0"/><text x="740" y="404" fill="#ebe7dc">蒸留 → 桜の相</text>
          <rect x="880" y="300" width="190" height="56" rx="10" fill="#1b2233" stroke="#f2a3c0"/><text x="975" y="324" fill="#ebe7dc">桜の巻物・桜鉄の触媒</text><text x="975" y="342" fill="#959bb0" font-size="11">使うと消える</text>
          <rect x="880" y="470" width="190" height="46" rx="10" fill="#1b2233" stroke="#f2a3c0"/><text x="975" y="498" fill="#ebe7dc">巻物・触媒を売り買い</text>
          <rect x="880" y="96" width="190" height="40" rx="10" fill="#2a1822" stroke="#f2a3c0" stroke-width="2"/><text x="975" y="121" fill="#f2a3c0" font-weight="700">使ってまた挑む</text>
        </g>
        <g data-r="petal" fill="none" stroke="#f2a3c0" stroke-width="2.5" marker-end="url(#mp)">
          <path d="M170 95 L228 112"/>
          <path d="M380 120 C420 120 420 255 438 257"/>
          <path d="M600 262 C640 262 640 398 658 399"/>
          <path d="M820 399 C850 399 860 330 878 328"/>
          <path d="M975 356 L975 468"/>
          <path d="M1070 493 C1095 493 1095 116 1072 116"/>
        </g>
      </g>
    </svg>
  </div>
  <p>決まっていること：特性は落ちた枝角に入る／器は鍛冶の職人が作る／1つの装備に特性1つ／枝角も巻物も売り買いできる／特性を入れるのも外れ3本を合わせるのも魔術の注入／NPC は売らない。</p>
</main>

<script>
(() => {
  const groups = [...document.querySelectorAll('svg [data-r]')];
  document.querySelectorAll('.rbtn').forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.r;
    document.querySelectorAll('.rbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    groups.forEach(g => g.classList.toggle('dim', r !== 'all' && g.dataset.r !== r && g.dataset.r !== 'both'));
  }));
})();
</script>
